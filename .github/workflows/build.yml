name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

# ワークフローに与える権限は読み取りだけにする
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 外部 Action はタグではなくコミット SHA で固定（タグの差し替え対策）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # gradle-wrapper.jar が公式のものか検証する
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - name: APK の SHA-256 を表示
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flipcover-apk
          path: app/build/outputs/apk/debug/*.apk
